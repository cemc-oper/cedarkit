name: ci

on:
  push:
    branches: ["main", "develop"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Components (reki, cedarkit-comp, cedarkit-plots) are installed
          # from PyPI; [tool.uv.sources] local paths only apply to uv.
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build
        run: python -m build
