[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cedarkit"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "A toolkit for meteorological data processing and visualization at CEMC/CMA."
readme = "README.md"
keywords = ["meteorology", "data", "graphic", "cemc", "cedarkit"]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "reki>=2026.8.0,<2027",
    "cedarkit-comp>=2026.7.0,<2027",
    "cedarkit-plots>=2026.9.0,<2027",
]

[project.urls]
Homepage = "https://github.com/cemc-oper/cedarkit"
Repository = "https://github.com/cemc-oper/cedarkit.git"

[project.optional-dependencies]
test = ["pytest"]

# Meta package: ship no Python modules. The `cedarkit` namespace is provided
# by component packages (cedarkit-comp, cedarkit-plots) as PEP 420 namespace
# packages, following the design of ECMWF's earthkit meta package.
[tool.setuptools]
packages = []

[tool.setuptools_scm]

[tool.uv.sources]
reki = { path = "../reki", editable = true }
cedarkit-comp = { path = "../cedarkit-comp", editable = true }
cedarkit-plots = { path = "../cedarkit-plots", editable = true }
